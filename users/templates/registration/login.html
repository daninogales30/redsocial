{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Pixora</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'users/static/css/login.css' %}">
</head>
<body class="base">
<div class="split-container">
    <!-- Lado izquierdo: imágenes (carrusel) -->
    <div class="left-images">
        <div class="image-carousel" id="carouselImage"
             style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&h=800&fit=crop');">
            <div class="carousel-dots">
                <span class="dot active"
                      data-img="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&h=800&fit=crop"></span>
                <span class="dot"
                      data-img="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&h=800&fit=crop"></span>
                <span class="dot"
                      data-img="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&h=800&fit=crop"></span>
                <span class="dot"
                      data-img="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=600&h=800&fit=crop"></span>
            </div>
        </div>
    </div>

    <!-- Lado derecho: formulario login -->
    <div class="right-login">
        <div class="login-card">
            <h1 class="login-title">Iniciar sesión en Pixora</h1>
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    {{ form.username }}
                </div>
                <div class="input-group">
                    {{ form.password }}
                </div>
                <button type="submit" class="login-btn">Iniciar sesión</button>
                <div class="forgot-link">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
            <div class="signup-link">
                <a href="{% url 'users:register' %}">Crear cuenta nueva</a>
            </div>
        </div>
    </div>
</div>

</div>

<script>
    // Carrusel interactivo
    const dots = document.querySelectorAll('.dot');
    const carousel = document.getElementById('carouselImage');
    dots.forEach(dot => {
        dot.addEventListener('click', function () {
            const imgUrl = this.getAttribute('data-img');
            carousel.style.backgroundImage = `url('${imgUrl}')`;
            dots.forEach(d => d.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Modo oscuro / claro global
        const darkModeSwitch = document.getElementById('darkModeSwitch');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (darkModeSwitch) darkModeSwitch.checked = true;
            } else {
                document.body.classList.remove('dark-mode');
                if (darkModeSwitch) darkModeSwitch.checked = false;
            }
        }

        // Cargar tema guardado
        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        // Cambiar tema con el switch
        if (darkModeSwitch) {
            darkModeSwitch.addEventListener('change', function () {
                if (this.checked) {
                    applyTheme('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    applyTheme('light');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    });
</script>
</body>
</html>
